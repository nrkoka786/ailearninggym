  <script type="application/ld+json">{"@context":"https://schema.org","@type":"LearningResource","name":"Personalized AI Learning Path Builder","description":"A guided intake that creates a goal-based AI learning curriculum.","provider":{"@type":"Organization","name":"AI Learning Gym","url":"https://ailearninggym.com/"},"educationalUse":"Self-paced learning"}</script>
  <style>
    :root{--ink:#14213d;--muted:#5f6b7c;--paper:#f5f7fc;--panel:#fff;--line:#dce3ee;--brand:#5b5bd6;--dark:#101a2d;--mint:#dff8ed;--mintink:#166044;--warn:#fff3cd;--shadow:0 20px 55px rgba(20,33,61,.11)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}a{color:inherit}.wrap{width:min(1040px,calc(100% - 32px));margin:auto}.top{background:var(--dark);color:#fff}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-weight:850}.brand img{width:42px;height:42px;border-radius:11px;object-fit:cover}.navlinks{display:flex;gap:18px}.navlinks a{color:#dce4f3;text-decoration:none;font-size:.93rem}.hero{text-align:center;padding:55px 0 28px}.eyebrow{color:#3535a6;font-weight:800;font-size:.82rem;text-transform:uppercase;letter-spacing:.1em}.hero h1{font-size:clamp(2.25rem,5vw,3.8rem);line-height:1.06;letter-spacing:-.045em;margin:10px auto 14px}.hero p{color:var(--muted);max-width:690px;margin:auto;font-size:1.06rem}.app{margin:24px auto 72px;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.progress-shell{height:7px;background:#e9edf4}.progress{height:100%;width:0;background:linear-gradient(90deg,#5b5bd6,#8d66de);transition:width .25s}.app-head{display:flex;align-items:center;justify-content:space-between;padding:21px 30px;border-bottom:1px solid var(--line)}.step-label{font-size:.85rem;color:var(--muted);font-weight:750}.privacy{font-size:.8rem;color:var(--mintink);background:var(--mint);padding:6px 10px;border-radius:999px}.stage{padding:36px 30px 32px;min-height:430px}.question{max-width:720px;margin:auto}.question h2{font-size:clamp(1.7rem,3vw,2.35rem);line-height:1.2;letter-spacing:-.025em;margin:0 0 9px}.question>p{color:var(--muted);margin:0 0 24px}.goal-input{width:100%;min-height:130px;border:2px solid var(--line);border-radius:15px;padding:17px;font:inherit;font-size:1.06rem;resize:vertical;outline:none}.goal-input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(91,91,214,.1)}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{border:2px solid var(--line);background:#fff;border-radius:14px;padding:17px;text-align:left;cursor:pointer;color:var(--ink);font:inherit}.option:hover,.option.selected{border-color:var(--brand);background:#f5f5ff}.option strong{display:block;margin-bottom:3px}.option span{color:var(--muted);font-size:.88rem}.actions{max-width:720px;margin:28px auto 0;display:flex;justify-content:space-between;gap:12px}.btn{border:0;border-radius:11px;padding:13px 19px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center}.primary{background:var(--brand);color:#fff}.primary:hover{background:#4141b8}.secondary{background:#edf0f6;color:#39465a}.btn:disabled{opacity:.4;cursor:not-allowed}.error{color:#a42b2b;font-weight:700;font-size:.88rem;margin-top:8px;display:none}.result{display:none}.result-head{background:linear-gradient(135deg,#101a2d,#293960);color:#fff;padding:32px;border-radius:18px;margin-bottom:22px}.result-head .label{color:#9fe2c5;text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;font-weight:850}.result-head h2{font-size:clamp(2rem,4vw,3rem);line-height:1.12;margin:8px 0 10px}.result-head p{color:#d4ddec;margin:0;max-width:740px}.facts{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.fact{background:rgba(255,255,255,.1);padding:7px 10px;border-radius:999px;font-size:.84rem}.modules{display:grid;gap:13px}.module{border:1px solid var(--line);border-radius:15px;padding:19px;display:grid;grid-template-columns:42px 1fr;gap:14px}.num{width:42px;height:42px;border-radius:12px;background:#ededff;color:#34349f;font-weight:850;display:grid;place-items:center}.module h3{margin:0 0 5px}.module p{margin:0;color:var(--muted)}.activity{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.activity span{font-size:.76rem;background:#f0f3f8;padding:5px 8px;border-radius:999px;color:#4b586b}.result-actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:24px}.notice{background:var(--warn);padding:13px 15px;border-radius:11px;color:#685400;margin-top:18px;font-size:.9rem}footer{background:var(--dark);color:#cad3e2;padding:35px 0}.footer-flex{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.footer-flex a{color:#e2e8f4;text-decoration:none;margin-left:14px}
    @media(max-width:680px){.navlinks a:first-child{display:none}.stage{padding:28px 18px}.app-head{padding:17px 18px}.options{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.result-actions .btn{width:100%}.module{grid-template-columns:36px 1fr}.num{width:36px;height:36px}}

</head>
<body>
  <header class="top"><nav class="wrap nav"><a class="brand" href="/"><img src="/AI_Learning_Gym_Logo.jpg" alt=""><span>AI Learning Gym</span></a><div class="navlinks"><a href="/">Home</a><a href="/my-learning/">My Learning</a></div></nav></header>
  <main class="wrap">
    <section class="hero"><div class="eyebrow">Learning Path Builder</div><h1>Let’s build the right path for you.</h1><p>Five short questions help us choose the right scope, pace and activities. Your answers stay in this browser.</p></section>
    <section class="app" aria-live="polite">
      <div class="progress-shell"><div class="progress" id="progress"></div></div>
      <div class="app-head"><span class="step-label" id="stepLabel">Question 1 of 5</span><span class="privacy">Private on this device</span></div>
      <div class="stage">
        <div id="questionArea"></div>
        <div class="result" id="resultArea"></div>
      </div>
    </section>
  </main>
  <footer><div class="wrap footer-flex"><span>© 2026 AI Learning Gym</span><span><a href="/about.html">About</a><a href="/privacy.html">Privacy</a><a href="/contact.html">Contact</a></span></div></footer>
  <script>
  (()=>{
    const state={goal:'',experience:'',outcome:'',time:'',style:''};let step=0;
    const questions=[
      {key:'goal',title:'What do you want to learn or accomplish?',help:'Describe a real result. A specific goal produces a more useful path.',type:'text'},
      {key:'experience',title:'How familiar are you with AI tools?',help:'Choose the closest match. We will adjust the explanations and practice.',options:[['new','I’m completely new','Start with plain-English foundations.'],['basic','I have tried them','I know the basics but need a better method.'],['regular','I use AI regularly','Skip introductions and focus on improvement.'],['advanced','I’m experienced','Emphasize workflow design and evaluation.']]},
      {key:'outcome',title:'What kind of result matters most?',help:'This helps us select the right practice and final project.',options:[['understand','Understand the topic','Build a reliable mental model.'],['create','Create something useful','Finish with a practical deliverable.'],['workflow','Improve a recurring workflow','Make a repeatable process faster or better.'],['choose','Compare options and decide','Evaluate tools or approaches confidently.']]},
      {key:'time',title:'How much time can you spend?',help:'Course length is based on your goal and available effort.',options:[['quick','30–60 minutes total','A compact Quick Skill.'],['days','20–30 minutes for a few days','A Focused Skill with practice.'],['weeks','About 30 minutes for 1–3 weeks','A fuller Skill Path.'],['deep','One hour or more each week','A deeper path with projects.']]},
      {key:'style',title:'How do you learn best?',help:'Every path includes practice; this changes what receives the most emphasis.',options:[['examples','Show me examples','Compare good and weak results.'],['hands','Let me practice','Use short exercises immediately.'],['explain','Explain it clearly','Build understanding before practice.'],['balanced','Use a balanced mix','Combine explanations, examples and exercises.']]}
    ];
    const q=document.getElementById('questionArea'),result=document.getElementById('resultArea'),progress=document.getElementById('progress'),label=document.getElementById('stepLabel');
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(){const item=questions[step];progress.style.width=((step+1)/questions.length*100)+'%';label.textContent=`Question ${step+1} of ${questions.length}`;let field='';if(item.type==='text'){field=`<textarea class="goal-input" id="goal" maxlength="300" placeholder="For example: I want to use ChatGPT to write clear weekly project updates.">${esc(state.goal)}</textarea><div class="error" id="error">Please describe what you want to learn.</div>`}else{field=`<div class="options">${item.options.map(o=>`<button type="button" class="option ${state[item.key]===o[0]?'selected':''}" data-value="${o[0]}"><strong>${o[1]}</strong><span>${o[2]}</span></button>`).join('')}</div><div class="error" id="error">Please select one option.</div>`}q.innerHTML=`<div class="question"><h2>${item.title}</h2><p>${item.help}</p>${field}</div><div class="actions"><button class="btn secondary" id="back" ${step===0?'disabled':''}>← Back</button><button class="btn primary" id="next">${step===questions.length-1?'Create my path':'Continue →'}</button></div>`;if(item.options){q.querySelectorAll('.option').forEach(b=>b.onclick=()=>{state[item.key]=b.dataset.value;q.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')})}document.getElementById('back').onclick=()=>{if(step>0){step--;render()}};document.getElementById('next').onclick=()=>{if(item.type==='text')state.goal=document.getElementById('goal').value.trim();if(!state[item.key]){document.getElementById('error').style.display='block';return}if(step<questions.length-1){step++;render()}else generate()}}
    function topicFor(goal){const g=goal.toLowerCase();if(/email|message|reply|inbox/.test(g))return'email';if(/social|linkedin|facebook|instagram|post|content/.test(g))return'social';if(/image|photo|midjourney|dall|visual/.test(g))return'image';if(/code|python|javascript|program|developer/.test(g))return'code';if(/compare|which.*(ai|llm)|chatgpt.*claude|gemini|grok/.test(g))return'compare';if(/chatgpt|prompt|ai/.test(g))return'foundations';return'productivity'}
    const catalog={
      email:{title:'Write Better Emails with AI',summary:'Learn a reliable process for planning, drafting and reviewing emails without losing your facts, intent or voice.',mods:[['Define the message','Identify the reader, purpose, facts and requested action before prompting.'],['Build a useful prompt','Give the AI context, constraints, tone and an explicit output format.'],['Evaluate a draft','Check accuracy, clarity, missing context, tone and unnecessary language.'],['Practice on a real email','Draft and revise an email you genuinely need to send.'],['Create your repeatable workflow','Save a reusable prompt and a final review checklist.']]},
      social:{title:'Create Useful Social-Media Posts with AI',summary:'Turn an original idea into audience-specific posts while avoiding generic, repetitive AI copy.',mods:[['Choose one useful idea','Define the audience, problem and single takeaway.'],['Create the first draft','Prompt for a clear hook, useful body and appropriate call to action.'],['Make the post sound human','Replace clichés, add experience and verify every claim.'],['Adapt without duplicating','Reshape the idea for different platforms and formats.'],['Publish a finished post','Complete a final originality, accuracy and readability review.']]},
      image:{title:'Create Better AI Image Prompts',summary:'Translate a visual goal into precise instructions for subject, composition, lighting, mood and constraints.',mods:[['Define the visual purpose','Clarify audience, use, format and the most important subject.'],['Control the composition','Specify framing, viewpoint, placement and background.'],['Shape light and style','Describe lighting, palette, texture and visual treatment.'],['Protect essential details','State what must remain accurate and what the model must avoid.'],['Run a controlled iteration','Change one prompt variable at a time and compare results.']]},
      code:{title:'Use AI as a Careful Coding Partner',summary:'Use AI to explain, plan, write and review code while testing every important result yourself.',mods:[['Describe the technical goal','Provide language, environment, inputs, constraints and expected behavior.'],['Ask for a plan first','Break the task into testable steps before requesting code.'],['Generate a small change','Request the minimum useful implementation with explanations.'],['Test and diagnose','Run the code, capture exact errors and verify edge cases.'],['Review for safety and maintenance','Check dependencies, secrets, error handling and readability.']]},
      compare:{title:'Choose the Right AI Tool for the Task',summary:'Compare AI tools using your real tasks, repeatable tests and decision criteria instead of general rankings.',mods:[['Define the decision','List the tasks, constraints and evidence needed to choose.'],['Create fair test prompts','Use the same context, requirements and scoring method.'],['Evaluate the outputs','Score accuracy, usefulness, effort, speed and consistency.'],['Check practical constraints','Compare privacy, integrations, limits and cost.'],['Make a documented choice','Record the winner by task and when to reconsider.']]},
      foundations:{title:'Use ChatGPT and Other AI Tools Confidently',summary:'Build the foundations for giving clear instructions, checking answers and protecting sensitive information.',mods:[['Understand what AI is doing','Learn strengths, limitations and why confident answers can still be wrong.'],['Write a clear request','Combine goal, context, constraints and output format.'],['Improve through follow-ups','Correct assumptions and refine one requirement at a time.'],['Verify important outputs','Check facts, calculations, sources, privacy and fit.'],['Complete a real task','Use the full method on something valuable to you.']]},
      productivity:{title:'Build a Practical AI Workflow',summary:'Turn your goal into a repeatable process that combines human judgment with appropriate AI assistance.',mods:[['Map the current task','Define the starting information, steps, output and quality standard.'],['Choose where AI helps','Separate drafting, analysis and transformation from human decisions.'],['Design the prompts','Create reusable instructions with context and constraints.'],['Test on real examples','Compare results and document recurring failures.'],['Finalize the workflow','Add review checkpoints and a simple success measure.']]}
    };
    function generate(){const type=topicFor(state.goal),base=catalog[type],duration={quick:['Quick Skill','30–60 minutes',3],days:['Focused Skill','2–4 days',5],weeks:['Skill Path','1–3 weeks',5],deep:['Deep Path','3–6 weeks',5]}[state.time];let mods=base.mods.slice(0,duration[2]);if(state.experience==='advanced')mods=mods.map((m,i)=>i===0?['Define success and failure cases',m[1]]:m);const activities=state.style==='examples'?['Learn','Show Me','Test Me']:state.style==='hands'?['Try It','Test Me','Ask AI']:state.style==='explain'?['Learn','Show Me','Ask AI']:['Learn','Show Me','Try It','Test Me'];const plan={id:'plan-'+Date.now(),createdAt:new Date().toISOString(),goal:state.goal,topic:type,title:base.title,summary:base.summary,level:duration[0],duration:duration[1],experience:state.experience,outcome:state.outcome,style:state.style,modules:mods.map((m,i)=>({id:i+1,title:m[0],description:m[1],activities,complete:false,score:null,practice:''}))};localStorage.setItem('ailg_learning_plan_v1',JSON.stringify(plan));show(plan)}
    function show(plan){q.style.display='none';result.style.display='block';progress.style.width='100%';label.textContent='Your learning path';result.innerHTML=`<div class="result-head"><div class="label">${esc(plan.level)} · Personalized for your goal</div><h2>${esc(plan.title)}</h2><p>${esc(plan.summary)}</p><div class="facts"><span class="fact">Goal: ${esc(plan.goal)}</span><span class="fact">${esc(plan.duration)}</span><span class="fact">${plan.modules.length} modules</span></div></div><div class="modules">${plan.modules.map((m,i)=>`<article class="module"><div class="num">${i+1}</div><div><h3>${esc(m.title)}</h3><p>${esc(m.description)}</p><div class="activity">${m.activities.map(a=>`<span>${a}</span>`).join('')}</div></div></article>`).join('')}</div><div class="notice">Your path is created privately in this browser. AI Learning Gym does not send your answers to an external AI service.</div><div class="result-actions"><a class="btn primary" href="/my-learning/">Start this path →</a><button class="btn secondary" id="restart">Create a different path</button></div>`;document.getElementById('restart').onclick=()=>{localStorage.removeItem('ailg_learning_plan_v1');Object.keys(state).forEach(k=>state[k]='');step=0;result.style.display='none';q.style.display='block';render()}}
    const params=new URLSearchParams(location.search),incoming=params.get('goal');if(incoming)state.goal=incoming.slice(0,300);render();
  })();
  </script>
</body>
</html>
