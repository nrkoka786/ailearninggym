  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RPRW3TN403"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-RPRW3TN403');</script>
  <style>
    :root{--ink:#14213d;--muted:#5e6b7c;--paper:#f4f6fb;--panel:#fff;--line:#dce3ee;--brand:#5b5bd6;--dark:#101a2d;--green:#16835a;--red:#a43838;--soft:#eeeeff;--shadow:0 18px 45px rgba(20,33,61,.09)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}.wrap{width:min(1160px,calc(100% - 32px));margin:auto}.top{background:var(--dark);color:#fff}.nav{min-height:68px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:850}.brand img{width:40px;height:40px;border-radius:10px;object-fit:cover}.nav a:last-child{color:#dce4f3;text-decoration:none}.crumb{padding:20px 0 12px;color:var(--muted);font-size:.9rem}.crumb a{color:#4545b5}.layout{display:grid;grid-template-columns:260px 1fr;gap:24px;padding-bottom:70px}.sidebar,.lesson{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.sidebar{padding:18px;align-self:start;position:sticky;top:16px}.sidebar-label{font-size:.74rem;color:#4b4bad;text-transform:uppercase;letter-spacing:.09em;font-weight:850}.sidebar h2{font-size:1.05rem;line-height:1.3;margin:7px 0 16px}.module-link{display:flex;gap:9px;padding:10px;border-radius:10px;text-decoration:none;color:#4b586b;font-size:.88rem;margin:3px 0}.module-link:hover,.module-link.active{background:var(--soft);color:#34349b}.module-link.done{color:var(--green)}.dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.72rem;flex:none}.done .dot{background:#daf5e8;border-color:#a9ddc7}.lesson{overflow:hidden}.lesson-head{background:linear-gradient(135deg,#101a2d,#2b3b62);color:#fff;padding:33px}.kicker{font-size:.76rem;color:#9fe2c5;text-transform:uppercase;letter-spacing:.1em;font-weight:850}.lesson-head h1{font-size:clamp(2rem,4vw,3rem);line-height:1.12;margin:8px 0}.lesson-head p{margin:0;color:#d5deed}.tabs{display:flex;gap:4px;padding:12px 22px;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;background:transparent;border-radius:9px;padding:10px 13px;font:inherit;font-weight:750;color:#657286;cursor:pointer;white-space:nowrap}.tab.active{background:var(--soft);color:#37379f}.pane{display:none;padding:31px}.pane.active{display:block}.pane h2{font-size:1.55rem;margin:0 0 12px}.pane h3{margin:27px 0 8px}.pane p,.pane li{color:#455268}.callout{background:#f0f2ff;border-left:4px solid var(--brand);padding:16px 18px;border-radius:0 11px 11px 0;margin:20px 0}.formula{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0}.formula div{background:#f5f7fb;border:1px solid var(--line);border-radius:11px;padding:13px;text-align:center;font-weight:800;font-size:.9rem}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.sample{border:1px solid var(--line);border-radius:13px;padding:17px}.sample.bad{background:#fff7f7}.sample.good{background:#f2fbf7}.sample strong{display:block;margin-bottom:7px}.sample p{margin:0;font-size:.92rem}.practice{width:100%;min-height:180px;border:2px solid var(--line);border-radius:13px;padding:15px;font:inherit;resize:vertical;outline:none}.practice:focus{border-color:var(--brand)}.hint{font-size:.86rem;color:var(--muted)}.btn{border:0;border-radius:10px;background:var(--brand);color:#fff;padding:12px 17px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#edf0f5;color:#435064}.choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px;margin:9px 0;cursor:pointer;font:inherit;color:var(--ink)}.choice:hover,.choice.selected{border-color:var(--brand);background:#f5f5ff}.feedback{display:none;padding:16px;border-radius:12px;margin:16px 0}.feedback.correct{display:block;background:#e7f8ef;color:#146947}.feedback.incorrect{display:block;background:#fff0f0;color:#8b2c2c}.adaptive{display:none;background:#fff8df;border:1px solid #ead28a;border-radius:13px;padding:17px;margin-top:15px}.adaptive.show{display:block}.ask-prompt{background:#101a2d;color:#eef2f8;padding:18px;border-radius:13px;white-space:pre-wrap}.lesson-footer{display:flex;justify-content:space-between;gap:12px;padding:22px 31px;border-top:1px solid var(--line)}footer{background:var(--dark);color:#cad3e2;padding:30px 0}
    @media(max-width:820px){.layout{grid-template-columns:1fr}.sidebar{position:static}.sidebar .module-list{display:none}.formula{grid-template-columns:1fr 1fr}.comparison{grid-template-columns:1fr}.pane{padding:23px 18px}.lesson-footer{padding:18px;flex-wrap:wrap}.lesson-footer .btn{flex:1}}

<body>
  <header class="top"><nav class="wrap nav"><a class="brand" href="/"><img src="/AI_Learning_Gym_Logo.jpg" alt=""><span>AI Learning Gym</span></a><a href="/my-learning/">My Learning</a></nav></header>
  <main class="wrap"><div class="crumb"><a href="/my-learning/">My Learning</a> / <span id="crumb">Lesson</span></div><div id="app"></div></main>
  <footer><div class="wrap">© 2026 AI Learning Gym · Practice deliberately. Verify important AI output.</div></footer>
  <script>
  (()=>{
    const key='ailg_learning_plan_v1',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let plan;try{plan=JSON.parse(localStorage.getItem(key)||'null')}catch(e){plan=null}const app=document.getElementById('app');if(!plan||!Array.isArray(plan.modules)){app.innerHTML='<section class="lesson"><div class="pane active"><h2>No learning path found</h2><p>Create a learning path before opening a lesson.</p><a class="btn" href="/learn/">Create my path</a></div></section>';return}
    const params=new URLSearchParams(location.search);let idx=Math.max(0,Math.min(plan.modules.length-1,Number(params.get('module')||0)));const module=plan.modules[idx],topic=plan.topic||inferTopic(plan.title);
    function inferTopic(title){const t=(title||'').toLowerCase();if(t.includes('email'))return'email';if(t.includes('social'))return'social';if(t.includes('confident')||t.includes('chatgpt'))return'foundations';return'general'}
    const content={
      email:[
        {learn:'Before asking AI to write, identify four facts: who will read the email, why you are writing, what the reader must know, and what action you want next. AI can improve wording, but it cannot safely invent these facts.',bad:'Write a professional email about the project.',good:'Draft a concise update to our client. Say that testing is complete, deployment moved from Tuesday to Thursday, and no action is required. Use a calm professional tone and keep it under 120 words.',practice:'Write the audience, purpose, required facts, and desired action for an email you genuinely need.',q:'Which information should be decided before asking AI to draft an email?',choices:['The font and background color','The audience, purpose, facts, and requested action','The AI model’s favorite writing style'],answer:1,why:'Those four elements determine whether the message is accurate and useful.',ask:'Help me clarify an email before drafting it. Ask me one question at a time about the audience, purpose, facts, and requested action. Do not draft until all four are clear.'},
        {learn:'A reliable email prompt combines context, task, factual constraints, tone, and format. Explicit constraints reduce guessing and make the first draft easier to review.',bad:'Make this sound better.',good:'Rewrite the email below for a customer who is waiting for a repair. Preserve every date and price exactly. Use a respectful, reassuring tone, keep it under 150 words, and end with the next action.',practice:'Create a reusable email prompt containing context, task, constraints, tone, and output format.',q:'What is the safest instruction when an email contains dates or prices?',choices:['Tell AI to make the message persuasive','Tell AI to preserve every date and price exactly','Remove the numbers before reviewing'],answer:1,why:'Important facts should be explicitly protected and then checked by the sender.',ask:'Review my email prompt. Identify missing context, facts that must not change, tone requirements, and the desired output format. Suggest improvements without drafting the email.'},
        {learn:'Treat an AI draft as a proposal, not a finished message. Review it in this order: factual accuracy, missing context, requested action, tone, and unnecessary language.',bad:'The draft sounds polished, so send it without checking.',good:'Compare the draft with the original facts, confirm names and numbers, read the request from the recipient’s perspective, and remove unsupported claims.',practice:'Paste or summarize an AI-generated email and list five checks you would perform before sending it.',q:'What should you review first in an AI-generated email?',choices:['Whether it uses sophisticated words','Whether the facts are accurate','Whether it includes several adjectives'],answer:1,why:'A polished email with incorrect facts can cause real harm.',ask:'Audit this email without rewriting it. List factual claims, unclear statements, missing context, tone risks, and the requested action. Mark anything that I must verify.'},
        {learn:'Practice is most useful when it uses a real situation. Separate drafting from judgment: let AI propose language, while you remain responsible for the facts, relationship, and final decision.',bad:'Use a fictional situation that has no relevance to your work.',good:'Choose a real low-risk email, create the prompt, generate a draft, compare it with your intent, and revise it in your own voice.',practice:'Draft the exact prompt for a real, low-risk email. Then note which parts require your personal judgment.',q:'Which task should remain yours when using AI for email?',choices:['Making the final judgment before sending','Generating every possible synonym','Counting the number of sentences'],answer:0,why:'You remain responsible for accuracy, intent, relationship context, and the decision to send.',ask:'Act as an email coach. Ask me for my draft and intended outcome, then help me identify mismatches. Do not invent facts or send anything.'},
        {learn:'A reusable workflow reduces effort without removing judgment: collect facts, build the prompt, generate a draft, review it, personalize it, and approve it yourself.',bad:'Reuse one vague prompt for every email and trust the output.',good:'Save a structured prompt with placeholders, plus a checklist for facts, privacy, tone, action, and final approval.',practice:'Write your reusable email workflow as six short steps and include a final approval checkpoint.',q:'What makes an AI email workflow reliable?',choices:['Automatic sending','A repeatable process with review checkpoints','Using the longest possible prompt'],answer:1,why:'Reliability comes from repeatable inputs, protected facts, and human review.',ask:'Turn my email-writing process into a reusable checklist. Include input collection, protected facts, drafting, verification, personalization, and final approval.'}
      ],
      social:[
        {learn:'Strong posts begin with one useful idea for one audience. Decide the reader, the problem, and the single takeaway before choosing a hook or format.',bad:'Write a viral post about AI.',good:'Write for small-business owners who lose time answering repetitive customer questions. Explain one practical way AI can help, using a specific example and no hype.',practice:'State your audience, their problem, and the one takeaway your post should deliver.',q:'What is the best starting point for a useful social post?',choices:['A large list of hashtags','One useful idea for a defined audience','A request to make the post viral'],answer:1,why:'Specific audience value creates a stronger post than generic reach tactics.',ask:'Help me sharpen one social-post idea. Ask about the audience, their problem, my firsthand observation, and the one takeaway. Do not draft yet.'},
        {learn:'A good drafting prompt provides the audience, purpose, source idea, tone, length, and desired response. It should prohibit invented stories and unsupported statistics.',bad:'Write an engaging LinkedIn post.',good:'Turn my notes into a 150-word LinkedIn post for owners of local service businesses. Use a practical, conversational tone. Keep my example, avoid invented statistics, and end with one genuine question.',practice:'Write a drafting prompt for your idea, including audience, tone, length, evidence, and call to action.',q:'Which instruction reduces generic AI social copy?',choices:['Use more buzzwords','Include a real observation and prohibit invented details','Add ten emojis'],answer:1,why:'Original observations and factual constraints make the output more distinctive and trustworthy.',ask:'Review this social-media prompt for specificity. Check audience, useful takeaway, evidence, tone, length, and prohibited inventions.'},
        {learn:'Humanize a draft by replacing clichés with specific experience, varying sentence rhythm, removing empty claims, and verifying all facts. Your viewpoint is the part AI cannot supply honestly.',bad:'In today’s fast-paced digital landscape, AI is revolutionizing everything.',good:'Last week I timed how long I spent rewriting three routine customer replies: 42 minutes. A saved AI prompt cut the next batch to 12.',practice:'Rewrite one generic sentence using a concrete observation, example, or measured result you can verify.',q:'What most improves originality in an AI-assisted post?',choices:['More generic motivational phrases','A verifiable personal observation','Repeating the keyword several times'],answer:1,why:'Firsthand, verifiable detail gives the post a reason to exist.',ask:'Identify clichés, vague claims, and unsupported statements in this draft. Ask me for real details that could replace them.'},
        {learn:'Adapting content means changing the presentation for each audience and platform—not copying the same text everywhere. Preserve the idea while changing length, opening, pacing, and action.',bad:'Post the identical paragraph on every network.',good:'Use the same core lesson, but create a concise Facebook post, a professional LinkedIn version, and a visual caption with platform-appropriate context.',practice:'Describe how you would adapt one idea for two platforms without changing its core claim.',q:'What should remain consistent when adapting a post?',choices:['Every sentence and hashtag','The central idea and factual claims','The exact character count'],answer:1,why:'Format can change, but the underlying meaning and truth should not.',ask:'Adapt this verified idea for two platforms. Preserve the central claim and facts, but adjust opening, length, pacing, and call to action.'},
        {learn:'Before publishing, review usefulness, originality, accuracy, readability, platform fit, and the requested response. If the post would not help the intended reader without the link, improve it.',bad:'Publish immediately because the draft has no spelling errors.',good:'Check every claim, remove generic filler, confirm the post offers standalone value, and preview it on the target platform.',practice:'Create a six-item publishing checklist you can reuse for every AI-assisted post.',q:'What is the strongest publication test?',choices:['Does the post provide value to the intended reader?','Does it contain the word AI five times?','Is it as long as possible?'],answer:0,why:'Reader value is the core purpose; formatting and promotion support it.',ask:'Perform a pre-publication review of my post. Score usefulness, originality, factual support, readability, platform fit, and call to action from 1–5.'}
      ],
      foundations:[
        {learn:'Generative AI predicts useful responses from patterns. It can summarize, transform, brainstorm, explain, and draft, but it does not automatically know whether an answer is true or appropriate for your situation.',bad:'Treat every confident answer as verified fact.',good:'Use AI for assistance, then verify consequential facts, calculations, sources, and decisions.',practice:'List two tasks where AI can assist you and one decision that must remain yours.',q:'Why can a confident AI answer still be wrong?',choices:['Confidence is a writing style, not proof of accuracy','AI refuses to use language','Long answers are always false'],answer:0,why:'Fluent language can make uncertain or incorrect information sound authoritative.',ask:'Explain what generative AI can and cannot reliably do for my goal. Give practical examples and identify what I must verify.'},
        {learn:'Clear prompts usually contain four parts: the goal, relevant context, constraints, and desired output. You do not need magic words; you need useful information.',bad:'Help me with this.',good:'Explain compound interest to a beginner using a $1,000 example, no advanced math, and a five-point summary.',practice:'Rewrite a vague request using goal, context, constraints, and output format.',q:'Which prompt is more likely to produce a useful answer?',choices:['Tell me about business','Create a five-step checklist for a first-time seller preparing a product page','Be smarter'],answer:1,why:'It provides a task, audience, scope, and output format.',ask:'Review my prompt using four headings: goal, context, constraints, and output. Ask one clarifying question for anything essential that is missing.'},
        {learn:'The first response is a draft. Improve it through focused follow-ups: correct assumptions, add missing constraints, request examples, or ask for alternatives. Change one important thing at a time.',bad:'Repeat the same vague prompt and hope for a different result.',good:'Keep the useful parts, identify one deficiency, and give a precise correction such as “preserve the dates and shorten the introduction.”',practice:'Write two follow-up instructions that would improve an imperfect response without restarting.',q:'What is an effective follow-up?',choices:['Make it better','Preserve the examples, remove repetition, and reduce the answer to 200 words','Try again somehow'],answer:1,why:'A focused correction tells the model what to retain and what to change.',ask:'Help me improve an AI response iteratively. First ask what worked and what did not, then recommend one focused follow-up instruction.'},
        {learn:'Verification effort should match the risk. Check sources and calculations for financial, medical, legal, safety, or business-critical use. Never paste secrets, private customer data, passwords, or confidential documents without authorization.',bad:'Paste confidential information because the AI needs context.',good:'Remove identifiers, minimize sensitive details, and independently verify important claims using authoritative sources.',practice:'Identify sensitive information in a task you might give AI and describe how you would remove or generalize it.',q:'Which information should not be pasted into a public AI chat?',choices:['A fictional example','A public product description','Passwords and confidential customer records'],answer:2,why:'Secrets and confidential personal or business data require protection and authorization.',ask:'Review this proposed AI task for privacy and verification risks. Do not process the task itself; identify sensitive details and safer alternatives.'},
        {learn:'Complete a real task using the full loop: define the outcome, provide context, protect constraints, review the draft, verify important claims, and make the final decision yourself.',bad:'Judge success only by how polished the output looks.',good:'Define success before prompting and compare the final result against that standard.',practice:'Choose a low-risk real task and write your success criteria, prompt, review checklist, and final decision rule.',q:'Who is responsible for the final use of AI output?',choices:['The user applying the output','The text generator alone','Nobody if the writing sounds polished'],answer:0,why:'The person using the result must review its accuracy, appropriateness, and consequences.',ask:'Coach me through one complete AI-assisted task. Ask for my goal and success criteria first, then guide prompting, review, verification, and final judgment.'}
      ]
    };
    const fallback={learn:`This module focuses on ${module.title.toLowerCase()}. Begin by defining what a successful result looks like, the information available, the constraints that must be respected, and what requires human review.`,bad:'Ask for an undefined result and accept the first output.',good:`Use the module goal—${module.description}—to create a specific task, test it on a real example, and compare the result with explicit success criteria.`,practice:`Apply “${module.title}” to your goal: ${plan.goal}. Write the inputs, constraints, desired result, and verification steps.`,q:'Which approach creates the most reliable learning result?',choices:['Define success, practice on a real example, and review the outcome','Read without practicing','Accept the first answer automatically'],answer:0,why:'Active practice and review connect the concept to the learner’s real goal.',ask:`Act as a learning coach for this module: ${module.title}. My goal is: ${plan.goal}. Ask me one question at a time, give an example, then ask me to practice. Do not invent facts.`};
    const lesson=(content[topic]&&content[topic][idx])||fallback;document.title=`${module.title} | AI Learning Gym`;document.getElementById('crumb').textContent=module.title;
    function sidebar(){return `<aside class="sidebar"><div class="sidebar-label">${esc(plan.level)}</div><h2>${esc(plan.title)}</h2><div class="module-list">${plan.modules.map((m,i)=>`<a class="module-link ${i===idx?'active':''} ${m.complete?'done':''}" href="/lesson/?module=${i}"><span class="dot">${m.complete?'✓':i+1}</span><span>${esc(m.title)}</span></a>`).join('')}</div></aside>`}
    app.innerHTML=`<div class="layout">${sidebar()}<article class="lesson"><header class="lesson-head"><div class="kicker">Module ${idx+1} of ${plan.modules.length}</div><h1>${esc(module.title)}</h1><p>${esc(module.description)}</p></header><nav class="tabs" aria-label="Lesson sections"><button class="tab active" data-tab="learn">Learn</button><button class="tab" data-tab="show">Show Me</button><button class="tab" data-tab="try">Try It</button><button class="tab" data-tab="test">Test Me</button><button class="tab" data-tab="ask">Ask AI</button></nav><section class="pane active" id="learn"><h2>Learn the idea</h2><p>${esc(lesson.learn)}</p><div class="callout"><strong>A reliable pattern</strong><div class="formula"><div>Goal</div><div>Context</div><div>Constraints</div><div>Review</div></div><p>Use the pattern as a checklist, not as magic wording. The details must come from your real situation.</p></div><h3>Apply it to your goal</h3><p>Your goal is: <strong>${esc(plan.goal)}</strong>. Keep that outcome visible while completing this module.</p></section><section class="pane" id="show"><h2>Show me</h2><p>Compare the two approaches. Notice which version supplies the information needed for a useful and verifiable result.</p><div class="comparison"><div class="sample bad"><strong>Weak approach</strong><p>${esc(lesson.bad)}</p></div><div class="sample good"><strong>Stronger approach</strong><p>${esc(lesson.good)}</p></div></div><h3>What changed?</h3><p>The stronger version defines the intended result and limits unsupported guessing. It also makes review easier because success is more explicit.</p></section><section class="pane" id="try"><h2>Try it yourself</h2><p>${esc(lesson.practice)}</p><textarea class="practice" id="practice" placeholder="Write your response here…">${esc(module.practice||'')}</textarea><p class="hint">Saved only in this browser. Avoid entering passwords or confidential personal information.</p><button class="btn" id="savePractice">Save my practice</button><span id="saved" class="hint" style="margin-left:10px"></span></section><section class="pane" id="test"><h2>Test your understanding</h2><p><strong>${esc(lesson.q)}</strong></p><div id="choices">${lesson.choices.map((c,i)=>`<button class="choice" data-answer="${i}">${esc(c)}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="adaptive" id="adaptive"><strong>Adaptive review</strong><p>${esc(lesson.why)}</p><p>Return to <em>Learn</em> and <em>Show Me</em>, then try the question again. Focus on the difference between a polished-looking answer and a reliable process.</p></div></section><section class="pane" id="ask"><h2>Ask AI for guided practice</h2><p>Copy this coaching prompt into the AI assistant you prefer. It asks for guidance rather than simply completing the task for you.</p><div class="ask-prompt" id="askPrompt">${esc(lesson.ask)}</div><button class="btn" id="copyPrompt" style="margin-top:14px">Copy coaching prompt</button><p class="hint">Review the assistant’s answers and do not share confidential information.</p></section><footer class="lesson-footer"><a class="btn secondary" href="/my-learning/">← My Learning</a><button class="btn" id="complete">${module.complete?'Completed ✓':'Mark module complete'}</button></footer></article></div>`;
    document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.tab).classList.add('active')});
    document.getElementById('savePractice').onclick=()=>{module.practice=document.getElementById('practice').value.trim();save();document.getElementById('saved').textContent='Saved'};
    document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');const chosen=Number(c.dataset.answer),ok=chosen===lesson.answer,fb=document.getElementById('feedback'),ad=document.getElementById('adaptive');module.score=ok?100:0;save();fb.className='feedback '+(ok?'correct':'incorrect');fb.innerHTML=ok?`<strong>Correct.</strong> ${esc(lesson.why)}`:`<strong>Not quite.</strong> ${esc(lesson.why)}`;ad.classList.toggle('show',!ok)});
    document.getElementById('copyPrompt').onclick=async()=>{try{await navigator.clipboard.writeText(lesson.ask);document.getElementById('copyPrompt').textContent='Copied ✓'}catch(e){document.getElementById('copyPrompt').textContent='Select and copy the prompt'}};
    document.getElementById('complete').onclick=()=>{module.complete=true;save();if(idx<plan.modules.length-1)location.href='/lesson/?module='+(idx+1);else location.href='/my-learning/'};
    function save(){localStorage.setItem(key,JSON.stringify(plan))}
  })();
  </script>
</body>
</html>
