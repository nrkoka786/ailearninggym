name: Agent 3 prepare publication PR (human approval required)

on:
  workflow_dispatch:
    inputs:
      draft_branch:
        description: "Branch containing editor-reviewed draft"
        required: true
        type: string
      draft_slug:
        description: "Directory name inside agent_drafts"
        required: true
        type: string
      editor_verified:
        description: "I independently verified claims, source relevance, originality and article accuracy"
        required: true
        type: boolean
        default: false
      editor_approved:
        description: "I reviewed article content and authorize creation of a DRAFT publication PR (not publication)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: ${{ inputs.editor_verified && inputs.editor_approved }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          persist-credentials: true
      - name: Checkout approved draft branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.draft_branch }}
          path: draft
          persist-credentials: false
      - name: Validate input and prepare page and sitemap
        env:
          DRAFT_SLUG: ${{ inputs.draft_slug }}
        run: |
          set -euo pipefail
          [[ "$DRAFT_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || exit 1
          python site/agents/prepare_publication.py --site site --draft "draft/agent_drafts/$DRAFT_SLUG" --slug "$DRAFT_SLUG"
      - name: Create publication branch and DRAFT pull request
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_SLUG: ${{ inputs.draft_slug }}
        run: |
          set -euo pipefail
          branch="publication/review-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "blog/$DRAFT_SLUG/index.html" sitemap.xml
          git commit -m "Prepare editorially reviewed article: $DRAFT_SLUG"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --draft \
            --title "EDITOR APPROVAL REQUIRED: Publish $DRAFT_SLUG" \
            --body "Draft publication PR. Editor has checked the two manual attestations, but GitHub does not independently validate their truth. Review every claim, link, layout, SEO metadata and sitemap diff. **Merging this PR will publish to the live site.** No automatic merge is configured."
