<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Learning Path | AI Learning Gym</title>
  <meta name="description" content="Continue your saved AI Learning Gym path and track completed learning modules privately in your browser.">
  <meta name="robots" content="noindex,follow"><link rel="canonical" href="https://ailearninggym.com/my-learning/">
  <meta name="theme-color" content="#101a2d"><link rel="icon" href="/favicon.ico">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RPRW3TN403"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-RPRW3TN403');</script>
  <style>
    :root{--ink:#14213d;--muted:#5f6b7c;--paper:#f5f7fc;--panel:#fff;--line:#dce3ee;--brand:#5b5bd6;--dark:#101a2d;--green:#18845d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}.wrap{width:min(960px,calc(100% - 32px));margin:auto}.top{background:var(--dark);color:#fff}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:#fff;font-weight:850}.brand img{width:42px;height:42px;border-radius:11px;object-fit:cover}.nav>a:last-child{color:#dce4f3;text-decoration:none}.hero{padding:52px 0 26px}.hero h1{font-size:clamp(2.2rem,5vw,3.6rem);letter-spacing:-.045em;line-height:1.08;margin:0 0 10px}.hero p{color:var(--muted);margin:0}.empty,.course{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;margin:20px 0 70px;box-shadow:0 18px 45px rgba(20,33,61,.08)}.empty{text-align:center;padding:60px 30px}.empty h2{margin-top:0}.empty p{color:var(--muted)}.btn{display:inline-flex;padding:13px 18px;border-radius:11px;background:var(--brand);color:#fff;text-decoration:none;font-weight:800;border:0;cursor:pointer}.btn.secondary{background:#edf0f6;color:#3f4b5e}.course-top{display:flex;justify-content:space-between;gap:20px;align-items:start;padding-bottom:22px;border-bottom:1px solid var(--line)}.label{color:#4141b8;font-size:.8rem;font-weight:850;text-transform:uppercase;letter-spacing:.08em}.course h2{font-size:2rem;margin:5px 0 7px}.summary{color:var(--muted);margin:0}.meter{margin:25px 0}.meter-line{height:10px;border-radius:999px;background:#e7ebf2;overflow:hidden}.meter-fill{height:100%;width:0;background:linear-gradient(90deg,#5b5bd6,#2ca878);transition:width .25s}.meter-text{font-size:.86rem;color:var(--muted);margin-top:7px}.modules{display:grid;gap:12px}.module{display:grid;grid-template-columns:34px 1fr;gap:14px;border:1px solid var(--line);border-radius:15px;padding:18px}.module:hover{border-color:#aaaaf0}.module input{width:22px;height:22px;margin-top:3px;accent-color:var(--green)}.module h3{margin:0 0 4px}.module p{margin:0;color:var(--muted);font-size:.92rem}.module.done{background:#f0fbf6;border-color:#bfe8d5}.module.done h3{text-decoration:line-through;color:#52645c}.activities{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.activities span,.score{background:#f0f3f8;border-radius:999px;padding:4px 8px;font-size:.74rem;color:#536074}.module-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:13px}.open{color:#4141b8;font-weight:800;text-decoration:none}.open:hover{text-decoration:underline}.score{background:#e8f7ef;color:#116944;font-weight:800}.course-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}footer{background:var(--dark);color:#cad3e2;padding:32px 0}footer a{color:#fff}
    @media(max-width:620px){.course-top{display:block}.course-top .btn{margin-top:15px}.empty,.course{padding:22px}.course-actions .btn{width:100%;justify-content:center}}
  </style>
</head>
<body>
  <header class="top"><nav class="wrap nav"><a class="brand" href="/"><img src="/AI_Learning_Gym_Logo.jpg" alt=""><span>AI Learning Gym</span></a><a href="/learn/">Create a path</a></nav></header>
  <main class="wrap"><section class="hero"><h1>My Learning</h1><p>Your current learning path and progress are stored privately in this browser.</p></section><div id="content"></div></main>
  <footer><div class="wrap">© 2026 AI Learning Gym · <a href="/privacy.html">Privacy</a></div></footer>
  <script>
  (()=>{const content=document.getElementById('content'),key='ailg_learning_plan_v1';let plan;try{plan=JSON.parse(localStorage.getItem(key)||'null')}catch(e){plan=null}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!plan||!Array.isArray(plan.modules)){content.innerHTML='<section class="empty"><h2>No learning path saved yet</h2><p>Answer five short questions to create a path matched to your goal and available time.</p><a class="btn" href="/learn/">Create my learning path →</a></section>';return}function save(){localStorage.setItem(key,JSON.stringify(plan))}function render(){const done=plan.modules.filter(m=>m.complete).length,pct=Math.round(done/plan.modules.length*100);content.innerHTML=`<section class="course"><div class="course-top"><div><div class="label">${esc(plan.level)} · ${esc(plan.duration)}</div><h2>${esc(plan.title)}</h2><p class="summary">${esc(plan.summary)}</p></div><a class="btn secondary" href="/learn/">Create another path</a></div><div class="meter"><div class="meter-line"><div class="meter-fill" style="width:${pct}%"></div></div><div class="meter-text">${done} of ${plan.modules.length} modules completed · ${pct}%</div></div><div class="modules">${plan.modules.map((m,i)=>`<article class="module ${m.complete?'done':''}"><input aria-label="Mark module ${i+1} complete" type="checkbox" data-index="${i}" ${m.complete?'checked':''}><div><h3>${i+1}. ${esc(m.title)}</h3><p>${esc(m.description)}</p><div class="activities">${(m.activities||[]).map(a=>`<span>${esc(a)}</span>`).join('')}</div><div class="module-actions"><a class="open" href="/lesson/?module=${i}">${m.complete?'Review lesson':'Open lesson'} →</a>${Number.isFinite(m.score)?`<span class="score">Knowledge check: ${m.score}%</span>`:''}</div></div></article>`).join('')}</div><div class="course-actions"><button class="btn secondary" id="reset">Reset progress</button><button class="btn secondary" id="delete">Delete this path</button></div></section>`;content.querySelectorAll('input[type=checkbox]').forEach(box=>box.onchange=()=>{plan.modules[Number(box.dataset.index)].complete=box.checked;save();render()});document.getElementById('reset').onclick=()=>{plan.modules.forEach(m=>{m.complete=false;m.score=null;m.practice='' });save();render()};document.getElementById('delete').onclick=()=>{if(confirm('Delete this saved learning path from this browser?')){localStorage.removeItem(key);location.reload()}}}render()})();
  </script>
</body>
</html>
